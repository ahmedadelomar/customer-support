<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>CustomerSupport</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#5B2C8D">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">

  <!--
    Tajawal carries the Arabic UI and Inter the Latin one; both are named in the Tailwind font stack,
    so without these the Arabic falls back to a system font and looks nothing like the design.
    `preconnect` first: the font CSS and the font files come from two different origins, and without
    it the browser pays a fresh connection cost for the second one.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap"
  >
</head>
<body>
  <app-root></app-root>
</body>
</html>
