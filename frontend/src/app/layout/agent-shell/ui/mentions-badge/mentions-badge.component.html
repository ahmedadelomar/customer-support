@if (canCollaborate()) {
  <a
    routerLink="/agent/mentions"
    class="btn-secondary relative px-3 py-1.5"
    [attr.aria-label]="'collaboration.mentions.title' | translate"
  >
    🔔
    @if (unreadCount() > 0) {
      <span
        class="absolute -end-1 -top-1 flex h-4 min-w-4 items-center justify-center rounded-full bg-rose-600 px-1 text-[10px] font-semibold text-white"
      >
        {{ unreadCount() > 9 ? '9+' : unreadCount() }}
      </span>
    }
  </a>
}
