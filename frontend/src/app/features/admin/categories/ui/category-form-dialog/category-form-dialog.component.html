<app-modal [open]="open()" [titleKey]="category() ? 'admin.categories.edit' : 'admin.categories.create'" (closed)="close()">
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="space-y-3">
    <div>
      <label class="form-label" for="cat-code">{{ 'admin.categories.code' | translate }} *</label>
      <input id="cat-code" type="text" class="form-control" formControlName="code" />
      @if (showError('code')) {
        <p class="form-error">{{ 'admin.categories.codeHint' | translate }}</p>
      }
    </div>

    <div class="grid gap-3 sm:grid-cols-2">
      <div>
        <label class="form-label" for="cat-name-en">{{ 'admin.categories.nameEn' | translate }} *</label>
        <input id="cat-name-en" type="text" class="form-control" formControlName="nameEn" />
        @if (showError('nameEn')) {
          <p class="form-error">{{ 'validation.required' | translate }}</p>
        }
      </div>
      <div>
        <label class="form-label" for="cat-name-ar">{{ 'admin.categories.nameAr' | translate }} *</label>
        <input id="cat-name-ar" type="text" class="form-control" formControlName="nameAr" />
        @if (showError('nameAr')) {
          <p class="form-error">{{ 'validation.required' | translate }}</p>
        }
      </div>
    </div>

    <div>
      <label class="form-label" for="cat-description">{{ 'admin.categories.description' | translate }}</label>
      <textarea id="cat-description" rows="2" class="form-control" formControlName="description"></textarea>
    </div>

    <div class="grid gap-3 sm:grid-cols-2">
      <div>
        <label class="form-label" for="cat-priority">{{ 'admin.categories.defaultPriority' | translate }}</label>
        <select id="cat-priority" class="form-control" formControlName="defaultPriorityId">
          <option value="">{{ 'common.all' | translate }}</option>
          @for (option of priorityOptions(); track option.id) {
            <option [value]="option.id">{{ option.nameEn }}</option>
          }
        </select>
      </div>
      <div>
        <label class="form-label" for="cat-department">{{ 'admin.categories.defaultDepartment' | translate }}</label>
        <select id="cat-department" class="form-control" formControlName="defaultDepartmentId">
          <option value="">{{ 'common.all' | translate }}</option>
          @for (option of departmentOptions(); track option.id) {
            <option [value]="option.id">{{ option.nameEn }}</option>
          }
        </select>
      </div>
    </div>

    <div>
      <label class="form-label" for="cat-display-order">{{ 'admin.categories.displayOrder' | translate }}</label>
      <input id="cat-display-order" type="number" class="form-control max-w-32" formControlName="displayOrder" />
    </div>

    <label class="flex items-center gap-2 text-sm text-slate-700">
      <input type="checkbox" formControlName="isVisibleInPortal" />
      {{ 'admin.categories.visibleInPortal' | translate }}
    </label>

    <div class="flex justify-end gap-2 pt-2">
      <button type="button" class="btn-secondary" (click)="close()">{{ 'common.cancel' | translate }}</button>
      <button type="submit" class="btn-primary" [disabled]="saving()">
        {{ (saving() ? 'common.saving' : 'common.save') | translate }}
      </button>
    </div>
  </form>
</app-modal>
