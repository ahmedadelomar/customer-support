<app-modal [open]="open()" titleKey="tickets.merge.title" (closed)="close()">
  <div class="space-y-3">
    <div>
      <label class="form-label" for="merge-target">{{ 'tickets.merge.target' | translate }}</label>
      <input
        id="merge-target"
        type="text"
        class="form-control"
        placeholder="TCK-2026-000123"
        [ngModel]="targetNumber()"
        (ngModelChange)="targetNumber.set($event)"
      />
      <p class="mt-1 text-xs text-slate-500">{{ 'tickets.merge.targetHint' | translate }}</p>
      @if (errorKey()) {
        <p class="form-error">{{ errorKey()! | translate }}</p>
      }
    </div>

    <div>
      <label class="form-label" for="merge-reason">{{ 'tickets.merge.reason' | translate }}</label>
      <input id="merge-reason" type="text" class="form-control" [ngModel]="reason()" (ngModelChange)="reason.set($event)" />
    </div>

    <label class="flex items-center gap-2 text-sm text-slate-700">
      <input type="checkbox" [ngModel]="allowCrossCustomer()" (ngModelChange)="allowCrossCustomer.set($event)" />
      {{ 'tickets.merge.allowCrossCustomer' | translate }}
    </label>

    <div class="flex justify-end gap-2 pt-2">
      <button type="button" class="btn-secondary" (click)="close()">{{ 'common.cancel' | translate }}</button>
      <button type="button" class="btn-primary" [disabled]="saving() || !targetNumber().trim()" (click)="confirm()">
        {{ (saving() ? 'common.saving' : 'tickets.merge.confirm') | translate }}
      </button>
    </div>
  </div>
</app-modal>
